<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="rock-paper-scissors.css">
</head>

<body>

<div class="container">

  <p class="p1">Rock Paper Scissors</p>

  <button class="cssbutton" onclick="playGame('Rock')">
    <img src="Rock-emoji.png" class="img">
  </button>

  <button class="cssbutton" onclick="playGame('Paper')">
    <img src="Paper-emoji.png" class="img">
  </button>

  <button class="cssbutton" onclick="playGame('Scissors')">
    <img src="Scissors-emoji.png" class="img">
  </button>

  <div class="jsp"></div>

  <div class="score scorecss"></div>

  <button class="recss" onclick="resetScore()">Reset Score</button>

  <button class="autocss  autojs" onclick="autoPlay()">Auto Play</button>

</div>

<script src="rock-paper-scissors.js"></script>

</body>
</html>
